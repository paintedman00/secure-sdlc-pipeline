name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so new advisories are caught even when the code doesn't change.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SEMGREP_VERSION: "1.178.0"
  SEMGREP_RULES: --config p/python --config p/flask
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  semgrep:
    name: sast / semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # --baseline-commit needs the PR base in history
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Semgrep
        run: pip install "semgrep==${SEMGREP_VERSION}"

      # Report every finding to code scanning, where triage state lives.
      - name: Full scan
        run: semgrep scan $SEMGREP_RULES --metrics=off --sarif --output semgrep.sarif

      # Block only on high-severity findings this PR introduces, so existing
      # triaged findings don't hold up unrelated changes.
      - name: Gate on new high-severity findings
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          semgrep scan $SEMGREP_RULES --metrics=off
          --baseline-commit "$BASE_SHA" --severity ERROR --error

      - name: Upload SARIF
        if: ${{ !cancelled() && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  gitleaks:
    name: secrets / gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan full history, not only the latest tree
          persist-credentials: false

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks

      # Any secret blocks, whenever it was introduced: it must be rotated.
      # Scope to HEAD's history; the default (--all) would also scan every
      # other fetched branch and fail this PR for someone else's leak.
      - name: Scan git history
        run: >-
          ./gitleaks git --no-banner --redact
          --log-opts="--full-history HEAD"
          --report-format sarif --report-path gitleaks.sarif
          --exit-code 1 .

      - name: Upload SARIF
        if: ${{ !cancelled() && hashFiles('gitleaks.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # On PRs, compare against the base branch and fail only on newly
  # introduced vulnerabilities.
  osv-scanner-pr:
    name: sca / osv-scanner
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0

  # On main and on schedule, report every known vulnerability.
  osv-scanner:
    name: sca / osv-scanner
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
